$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Guild hierarchy"
type: "object"
properties:
  organizational_hierarchy:
    type: "array"
    items:
      type: "object"
      properties:
        parent:
          type: "string"
          minLength: 1
          pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
        child:
          type: "string"
          minLength: 1
          pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
      required:
        - "parent"
        - "child"
      additionalProperties: false
    uniqueItems: true
  domain_authority:
    type: "array"
    items:
      type: "object"
      properties:
        domain:
          type: "string"
          minLength: 1
          pattern: "^[a-z][a-z0-9_-]*(?:\\.[a-z][a-z0-9_-]*)*$"
        owner:
          type: "string"
          minLength: 1
          pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
        authority_level:
          type: "string"
          minLength: 1
          enum:
            - "A1"
            - "A2"
            - "A3"
            - "A4"
            - "A5"
            - "A6"
            - "A7"
            - "A8"
            - "A9"
        capabilities:
          type: "array"
          items:
            type: "string"
            minLength: 1
          uniqueItems: true
          minItems: 1
        exclusive:
          type: "boolean"
      required:
        - "domain"
        - "owner"
        - "authority_level"
        - "capabilities"
        - "exclusive"
      additionalProperties: false
    uniqueItems: true
required:
  - "organizational_hierarchy"
  - "domain_authority"
additionalProperties: false
