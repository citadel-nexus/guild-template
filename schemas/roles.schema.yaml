$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Guild roles"
type: "object"
properties:
  role_id:
    type: "string"
    minLength: 1
    pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
  kind:
    type: "string"
    minLength: 1
    enum:
      - "human"
      - "agent"
  authority_level:
    type: "string"
    minLength: 1
    enum:
      - "A1"
      - "A2"
      - "A3"
      - "A4"
      - "A5"
      - "A6"
      - "A7"
      - "A8"
      - "A9"
  capabilities:
    type: "array"
    items:
      type: "string"
      minLength: 1
    uniqueItems: true
  prohibitions:
    type: "array"
    items:
      type: "string"
      minLength: 1
    uniqueItems: true
    minItems: 1
  escalation:
    type: "string"
    minLength: 1
    pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
required:
  - "role_id"
  - "kind"
  - "authority_level"
  - "capabilities"
  - "prohibitions"
  - "escalation"
additionalProperties: false
$defs:
  escalation:
    type: "object"
    properties:
      default_route:
        type: "string"
        minLength: 1
        pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
      routes:
        type: "array"
        items:
          type: "object"
          properties:
            id:
              type: "string"
              minLength: 1
              pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
            to_role:
              type: "string"
              minLength: 1
              pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
            triggers:
              type: "array"
              items:
                type: "string"
                minLength: 1
              uniqueItems: true
              minItems: 1
            timeout_minutes:
              type: "integer"
              minimum: 1
            on_timeout:
              type: "string"
              const: "HELD"
          required:
            - "id"
            - "to_role"
            - "triggers"
            - "timeout_minutes"
            - "on_timeout"
          additionalProperties: false
        uniqueItems: true
        minItems: 1
    required:
      - "default_route"
      - "routes"
    additionalProperties: false
  delegation:
    type: "object"
    properties:
      delegation_id:
        type: "string"
        minLength: 1
        pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
      status:
        type: "string"
        minLength: 1
        enum:
          - "draft"
          - "active"
          - "revoked"
      from_role:
        type: "string"
        minLength: 1
        pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
      to_role:
        type: "string"
        minLength: 1
        pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
      authority_level:
        type: "string"
        minLength: 1
        enum:
          - "A1"
          - "A2"
          - "A3"
          - "A4"
          - "A5"
          - "A6"
          - "A7"
          - "A8"
          - "A9"
      capabilities:
        type: "array"
        items:
          type: "string"
          minLength: 1
        uniqueItems: true
      scope:
        type: "array"
        items:
          type: "string"
          minLength: 1
          pattern: "^[a-z][a-z0-9_-]*(?:\\.[a-z][a-z0-9_-]*)*$"
        uniqueItems: true
      expires_at:
        type: "string"
      approved_by:
        type: "string"
      revocation_route:
        type: "string"
        minLength: 1
        pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
    required:
      - "delegation_id"
      - "status"
      - "from_role"
      - "to_role"
      - "authority_level"
      - "capabilities"
      - "scope"
      - "expires_at"
      - "approved_by"
      - "revocation_route"
    additionalProperties: false
